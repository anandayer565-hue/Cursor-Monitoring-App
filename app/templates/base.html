<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Monitor{% endblock %} · Demo Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <a class="brand" href="{{ url_for('main.home') if is_authenticated else url_for('main.login') }}">Demo Monitor</a>
      <nav class="nav">
        {% if is_authenticated %}
          <a href="{{ url_for('main.home') }}">Home</a>
          <a href="{{ url_for('main.servers') }}">Servers</a>
          <span class="nav-user">{{ current_username }}</span>
          {% if logout_form %}
          <form method="post" action="{{ url_for('main.logout') }}" class="inline-form">
            {{ logout_form.hidden_tag() }}
            {{ logout_form.submit(class_="btn btn-link") }}
          </form>
          {% endif %}
        {% else %}
          <a href="{{ url_for('main.login') }}">Sign in</a>
        {% endif %}
      </nav>
    </header>

    <main class="content">
      {% block content %}{% endblock %}
    </main>

    <footer class="footer">
      <span>Local demo only · Metrics are read-only</span>
    </footer>
  </div>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
